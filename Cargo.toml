[package]
name = "cortex-tensor"
version = "0.1.0"
edition = "2024"
description = "Pure-Rust tensor, transformer, and MoE building blocks. Zero GPU/CUDA/Julia dependencies."
authors = ["Raul Mc"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rmems/cortex-tensor"
homepage = "https://github.com/rmems/cortex-tensor"

[lib]
name = "cortex_tensor"
path = "src/lib.rs"

[features]
default = []
sentry = ["dep:sentry"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rand = "0.10"
rayon = "1.7"
memmap2 = "0.9"
half = "2"
sentry = { version = "0.48", optional = true }

[profile.release]
opt-level = 3
lto = "fat"

[workspace]
# Standalone: detach from any parent Cargo workspace.
