# Azure Pipelines for cross-platform parity with GitHub Actions (addresses chore 6p8)
# Rust + Cargo are pre-installed on all Azure Pipelines hosted images (ubuntu/mac/windows-latest).
# No manual rustup/curl | sh needed (and it is Unix-only, would break Windows cmd.exe).
# See bot feedback from Gemini/CodeRabbit/Atlassian/Codacy/Devin/Qodo/ChatGPT-Codex.
trigger:
  branches:
    include:
      - main
pr:
  branches:
    include:
      - main

variables:
  CARGO_TERM_COLOR: always

jobs:
- job: Linux
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - checkout: self
    persistCredentials: false
  - script: |
      cargo fmt --all -- --check
      cargo build --verbose
      cargo test --verbose
      cargo clippy --all-targets --all-features -- -D warnings
    displayName: 'fmt + build + test + clippy on Linux (preinstalled rust)'

- job: macOS
  pool:
    vmImage: 'macOS-latest'
  steps:
  - checkout: self
    persistCredentials: false
  - script: |
      cargo build --verbose
      cargo test --verbose
    displayName: 'Build + test on macOS (preinstalled rust)'

- job: Windows
  pool:
    vmImage: 'windows-latest'
  steps:
  - checkout: self
    persistCredentials: false
  # Use PowerShell (pwsh) explicitly; script: alone is cmd.exe on Windows agents.
  # Cargo is pre-installed and in PATH on hosted windows-latest.
  - pwsh: |
      cargo build --verbose
      cargo test --verbose
    displayName: 'Build + test on Windows (preinstalled rust; pwsh for compatibility)'
    env:
      CARGO_TERM_COLOR: always
